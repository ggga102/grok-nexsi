<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0D9488" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="NEXSI" />
  <meta name="description" content="NEXSI — L'application compagnon des Étudiants en Soins Infirmiers. Organise ta journée, tes stages, tes documents et ta progression." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>NEXSI — Organisation ESI</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <div id="onboarding" class="onboarding"></div>

    <header class="app-header">
      <h1 id="header-title">Accueil</h1>
      <div class="header-actions">
        <button class="icon-btn" onclick="openSearch()" title="Recherche" aria-label="Recherche">🔍</button>
        <button class="icon-btn" onclick="openSettings()" title="Réglages" aria-label="Réglages">⚙️</button>
      </div>
    </header>

    <main class="main-content">
      <div id="panel-accueil" class="tab-panel active"></div>
      <div id="panel-fiches" class="tab-panel"></div>
      <div id="panel-terrain" class="tab-panel"></div>
      <div id="panel-soins" class="tab-panel"></div>
    </main>

    <button class="fab" onclick="openAI()" aria-label="Assistant IA" title="Assistant NEXSI">✨</button>

    <nav class="bottom-nav" role="tablist">
      <button class="nav-item active" data-tab="accueil" onclick="switchTab('accueil')" role="tab" aria-selected="true">
        <span class="nav-icon">🏠</span>
        <span>Accueil</span>
      </button>
      <button class="nav-item" data-tab="fiches" onclick="switchTab('fiches')" role="tab">
        <span class="nav-icon">📂</span>
        <span>Fiches</span>
      </button>
      <button class="nav-item" data-tab="terrain" onclick="switchTab('terrain')" role="tab">
        <span class="nav-icon">🏥</span>
        <span>Terrain</span>
      </button>
      <button class="nav-item" data-tab="soins" onclick="switchTab('soins')" role="tab">
        <span class="nav-icon">💉</span>
        <span>Soins</span>
      </button>
    </nav>

    <div id="ai-panel" class="ai-panel">
      <div class="ai-header">
        <button class="icon-btn" onclick="closeAI()" aria-label="Fermer">←</button>
        <h2>Assistant NEXSI</h2>
        <span class="badge muted">Demo</span>
      </div>
      <div class="ai-suggestions">
        <button class="ai-chip" onclick="aiChip('priorites')">Mes priorités</button>
        <button class="ai-chip" onclick="aiChip('app')">Structurer un APP</button>
        <button class="ai-chip" onclick="aiChip('stage')">Préparer un stage</button>
        <button class="ai-chip" onclick="aiChip('pharmaco')">Pharmacologie</button>
      </div>
      <div id="ai-messages" class="ai-messages"></div>
      <div class="ai-input-bar">
        <input type="text" id="ai-input" placeholder="Pose ta question…" autocomplete="off" />
        <button class="btn btn-primary btn-sm" onclick="sendAI()">Envoyer</button>
      </div>
    </div>

    <div id="modal-overlay" class="modal-overlay">
      <div class="modal">
        <div class="modal-handle"></div>
        <h3 id="modal-title"></h3>
        <div id="modal-body"></div>
      </div>
    </div>

    <div id="install-banner" class="install-banner">
      <div style="flex:1">
        <strong>Installer NEXSI</strong><br>
        <span style="opacity:0.9;font-size:0.8rem">Pour que tes données restent même si le navigateur fait le ménage.</span>
      </div>
      <button class="btn" onclick="installPWA()">Installer</button>
      <button class="icon-btn" style="background:transparent;color:white;font-size:1.1rem" onclick="dismissInstall()" aria-label="Fermer">✕</button>
    </div>

    <div id="offline-bar" class="offline-bar">Hors ligne — mode local actif</div>

    <div id="search-overlay" class="search-overlay">
      <div class="search-header">
        <button class="icon-btn" onclick="closeSearch()" aria-label="Fermer">←</button>
        <input type="search" id="global-search-input" placeholder="Rechercher…" oninput="runGlobalSearch(this.value)" autocomplete="off" />
      </div>
      <div id="search-results" class="search-results"></div>
    </div>

    <div id="screen-overlay" class="screen-overlay">
      <div class="screen-header">
        <button class="icon-btn" onclick="closeScreen()" aria-label="Retour">←</button>
        <h2 id="screen-title"></h2>
      </div>
      <div id="screen-body" class="screen-body"></div>
    </div>

    <div id="toast" class="toast"></div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
